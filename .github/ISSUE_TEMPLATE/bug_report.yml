name: Bug report
description: Something in HXtra doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check the README's [Known issues](https://github.com/wisemandenny/hxtra#known-issues) and the [open issues](https://github.com/wisemandenny/hxtra/issues) first.

        **HX Stomp stuck at the splash screen?** Power it off, hold Page Right while powering it on, and reinstall the stock firmware with Line 6 Updater. Then tell us what happened here.
  - type: dropdown
    id: version
    attributes:
      label: HXtra version
      description: The boot screen shows it at power-on, or see the release you downloaded. Not the HX Stomp firmware version (3.80.0).
      options:
        - v1.2.1
        - v1.2.0
        - v1.1.1
        - v1.1.0
        - v1.0.0
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running HXtra?
      options:
        - Installed with Line 6 Updater
        - Run from RAM
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How did you build it?
      options:
        - The setup page
        - build.py on the command line
    validations:
      required: true
  - type: dropdown
    id: nam-slots
    attributes:
      label: NAM A2 Lite slots in your build
      description: The number you picked under NAM A2 Lite on the setup page (HX_NAM_SLOTS with build.py).
      options:
        - "3"
        - "2"
        - "1"
        - "Off"
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: enabled
    attributes:
      label: Optional features on in your build
      description: Tick every one you left checked on the setup page (or switched on with build.py). Leave them all empty if you turned them all off.
      options:
        - label: Gain reduction meter (HX_GR)
        - label: Metronome block (HX_CLICK)
        - label: Noise gate in the FX Loop and Return blocks (HX_FX_GATE)
        - label: Input Sidechain on the Noise Gate block (HX_GATE_SC)
        - label: "USB monitoring: Path A Out (HX_USB_MONITOR)"
        - label: Real block names (HX_REAL_NAMES)
  - type: dropdown
    id: features
    attributes:
      label: Which feature is it about?
      multiple: true
      options:
        - BPM display
        - DSP usage display
        - Six snapshots
        - Long press and virtual footswitches
        - Looper
        - Tap LED color
        - Preset LED color
        - Tap command
        - Breathing line
        - Metronome
        - Gain-reduction meter
        - Tuner settings
        - Real block names
        - Custom boot screen
        - NAM A2 Lite
        - The setup page or installing
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What to press or change on the HX Stomp, in order, to make it happen again.
      placeholder: |
        1. Open Global Settings > Displays
        2. Set Tap LED Color to Rainbow
        3. Tap the TAP footswitch
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Photos or video
      description: A photo or short video of the screen helps a lot. Drag files in here.
  - type: input
    id: setup
    attributes:
      label: Computer and browser
      description: Only for problems with the setup page or installing.
      placeholder: macOS 15, Chrome 142
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: The preset you were using, MIDI gear connected, or other settings you changed.
